# /etc/nginx/sites-available/closahealth.com  (then: ln -s into sites-enabled, nginx -t, reload)
# Run `certbot --nginx -d closahealth.com -d www.closahealth.com` afterwards to add HTTPS.
server {
    listen 80;
    server_name closahealth.com www.closahealth.com;

    root /var/www/closa;          # the contents of frontend/dist
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API -> FastAPI (uvicorn on localhost)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have hashed names, so they can be cached for a long time
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

    # /privacy -> privacy.html, /plan/<token> and everything else -> the app
    location / { try_files $uri $uri.html /index.html; }
}
